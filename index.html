<script>
const T=[
{n:1,t:"Oír es Vivir: la audición, un tema de atención pública",s:"Sandra Sánchez, directora ejecutiva de Oír es Vivir, y charla con otorrinolaringología",k:"No es la depresión, sino lo que esta ocasiona.",g:[
["Concienciar y prevenir",["Primero debemos tomar conciencia de la importancia de la audición como sentido de aprendizaje y conexión social.","Oír es Vivir busca prevenir y alertar sobre la pérdida auditiva; sus miembros son embajadores de la audición.","Problemas estructurales: falta de conciencia en la población y falta de acceso a ayuda auditiva básica (audífonos, tamizajes, especialistas)."]],
["Hábitos de cuidado",["Revisar la audición al menos una vez al año, sobre todo después de los 40.","Regla 60/60: no usar audífonos más de 60 minutos seguidos ni a más del 60 % del volumen máximo.","No usar hisopos: la cera sale sola y se puede dañar la membrana timpánica.","Evitar exponerse a ruidos intensos sin protección: conciertos, maquinaria, sirenas."]],
["Datos de alerta",["Según la OMS, para 2050 una de cada cuatro personas podría sufrir pérdida auditiva (PA).","Desde los 40 años se pierde cerca de 1 % anual de la capacidad auditiva.","La PA puede causar problemas laborales y exclusión social; en niños frena el desarrollo, pues aprendemos al escuchar."]],
["Tipos y señales",["Conductiva (oído externo/medio), neurosensorial (oído interno) y mixta (ambas). La audiometría mide y comprueba la capacidad auditiva.","Señales: dificultad para oír a alguien desde otra habitación o para oír la televisión; tinnitus (zumbido de oído).","El collar de girasol identifica a personas con discapacidades ocultas, incluidas las auditivas."]],
["Depresión y pérdida auditiva",["La persona deja de socializar, bajan las defensas y se aísla, conectada a sus audífonos.","No es la depresión, sino lo que esta ocasiona: aislamiento, deterioro cognitivo, pérdida de oportunidades."]]]},
{n:2,t:"Reunión de creación de perfiles",s:"Perfil de Christian Loo, categoría Educación, Innovación y Tecnología",k:"Aquel que renuncia a su autenticidad renuncia a su libertad.",g:[
["Logística",["Cada perfil dura 19 segundos (es lo que se sube a YouTube) y tendré un patrocinador.","Grabación: 10 de octubre de 2026. Los perfiles salen del 8 al 16 de noviembre."]],
["Estructura del guion",["Intro, frase, comentario personal y despedida.","Idea central: siempre he pensado que es mucho más importante ser auténtico que tener las mejores respuestas.","Cierre: la educación y la tecnología."]]]},
{n:3,t:"Visita a la Autoridad del Canal de Panamá (ACP)",s:"Día 3, 8 de octubre. Alexis Pino, Sr. Lino y el subadministrador Miguel Lorenzo",k:"Cada gota de sudor cuenta.",g:[
["Pensamiento crítico",["Preocupa que las nuevas generaciones pierdan la capacidad de desarrollar pensamiento crítico: «¿dónde está el pensamiento investigativo?».","Si quieres generar respuestas, primero debes generarte preguntas.","Podemos tener ideas diferentes, pero con comunicación se puede progresar."]],
["Cifras y empleo",["Alexis Pino, analista de datos y responsabilidad social: 3 500 posiciones disponibles en 3 a 4 años para quienes piensen distinto.","El año fiscal empieza el 1 de octubre; el Canal debe dar al Estado más de 5 mil millones de dólares."]],
["IA y futuro del Canal (Miguel Lorenzo)",["La IA es un reto: hay riesgos, pero también oportunidades.","Usos: digitalización de datos y predicción meteorológica (2 millones de panameños toman agua de los lagos).","Futuro: un acueducto (2030-2035) y un hub logístico que dé valor a la mercancía.","Conclusión: ética, hacer lo que se debe hacer."]],
["Río Indio y comunidades",["Es un proyecto para todos los panameños; el reto son las comunidades, pero es de interés nacional. La solución: confiar en el Canal.","Lección: ser muy responsables con la dignidad de las comunidades para que digan «la ACP me hizo sentirme mejor en mi comunidad».","El Canal trabaja con el IDAAN en infraestructura y preparación ante fenómenos como El Niño."]],
["Para mi intervención",["La ACP busca jóvenes que potencien su capacidad de conocer con ayuda de la tecnología. La IA tendrá mayor importancia en la optimización de procesos.","Siempre pensar y organizar las ideas antes de comenzar."]]]},
{n:4,t:"UNFPA: juventudes y violencia digital",s:"Día 4, 9 de octubre. Fondo de Población de las Naciones Unidas, unidad de la ONU para la salud sexual y reproductiva",k:"Nuestros cuerpos no son un crimen.",g:[
["Comunicar con compromiso",["La comunicación debe ser un compromiso con la nación, no un deseo de salir en televisión (Janice, periodista).","El mensaje debe tener propósito, no solo buscar audiencia."]],
["Violencia digital",["Involucra comentarios y ciberacoso, y es fácil de ejercer; es nuestro deber parar el acoso en redes sociales.","VBG-FT: violencia basada en género facilitada por tecnología, con tres variables: acto u omisión, relación agresor-víctima y tecnología empleada. La VBG es la violencia de género cara a cara.","Ley Olimpia: Olimpia Coral fue víctima de ciberacoso por difundirse un video sexual sin su consentimiento; la ley castiga a quien difunde contenido sexual con malas intenciones.","Argentina ya tiene legislación específica sobre violencia digital."]],
["Jóvenes como agentes de cambio",["El enfoque de juventudes incentiva a los jóvenes a trabajar activamente, no solo por ser jóvenes, sino para todos.","Hay instituciones y personal (Defensoría, Ministerio de la Mujer), pero falta compromiso. Los casos de femicidio han aumentado.","Las denuncias deben presentarse dentro del territorio. Con menores de 14 años, el embarazo se considera automáticamente violencia."]]]},
{n:5,t:"IA en Liberty Latin America y pensamiento crítico",s:"Camilo Martí. Incluye apuntes sobre el futuro del trabajo (Anthropic)",k:"No deleguemos a la IA nuestro aprendizaje.",g:[
["Cómo funciona la IA",["La IA no siempre dice la verdad: te hace creerla con patrones de datos.","Evolución hacia más autonomía: machine learning (aprende de datos) → refuerzo (aprende del resultado) → IAG (copiloto de call center) → IAA (agentes, como un agente de voz para cobros)."]],
["Flujos multiagénticos",["Muchos agentes trabajan a la vez en un trabajo conjunto.","Sola (bajo riesgo): recordar algo a un cliente. Con humano (riesgo parcial): ofrecer hasta 10 % de descuento. Nunca: usar la ubicación sin consentimiento."]],
["Sentido humano",["Si la IA descifrara la conciencia humana, la respuesta sería la irrelevancia: toca pensar cómo vivir con esta tecnología."]],
["Trabajo del futuro",["La habilidad del futuro es el pensamiento crítico. Mito: en Panamá no hay trabajo; realidad: sí hay, pero faltan habilidades.","Tres escenarios según Anthropic: como internet (impacto bajo), revolución del trabajo (medio) y economía irreconocible (la IA supera a las personas en casi todo).","El conocimiento es cada vez más accesible, pero hace falta esfuerzo. El trabajo del futuro: administrar agentes de IA con nuestro conocimiento."]]]},
{n:6,t:"IA y astronomía: superinteligencia al servicio de la curiosidad",s:"Día 7 de apuntes, 11 de octubre. Federico, astrónomo y divulgador del centro astronómico de Travassos (Portugal), y Edgar (proyección y estructura)",k:"Accesibilidad no es simplificar, es multiplicar las formas de entrar en ella.",g:[
["Historia de la IA",["Antigua Grecia: autómatas con engranajes. Segunda Guerra Mundial: Alan Turing y el código Enigma.","Deep Blue vs. Kaspárov; en 2016, Lee Sedol (campeón de Go) cae ante una máquina que aprendía con otras máquinas."]],
["Cómo se toman datos con IA",["Entrada: miles de imágenes. Modelo: panorama y patrones. Salida: respuesta más probable. Revisión: comparar con el panorama humano.","Fórmula: herramienta adecuada + pregunta clara + criterio humano."]],
["Ciencia, accesibilidad y curiosidad",["Industria espacial (2009): faltaban anteojos para 3 mil millones de personas; solución: producir lentes con un polímero en el espacio.","Sonificación: convertir datos en sonido para hacerlos accesibles.","Observatorio: observaciones públicas, educación, formación de jóvenes y participación comunitaria."]],
["Reto personal",["Elegir un problema local, usar la herramienta adecuada y aplicar criterio humano.","Equivocarse no es el final: es información. Aprender requiere margen de error y la tecnología amplifica la atención humana."]]]},
{n:7,t:"Comunidad Dojo AI: democratizar el aprendizaje de la IA",s:"Sheila I. Pérez y Juan José Chovarría (Databricks)",k:"Solo escucha.",g:[
["Quiénes son",["Organización sin fines de lucro que busca democratizar y acelerar el aprendizaje de la IA."]],
["Usar la IA para aprender mejor",["Contrastar la historia de los distintos períodos de Panamá desde diferentes perspectivas.","Sesgo algorítmico: ocurre cuando una sola fuente se usa para generar prompts. Panamá es un crisol de razas."]],
["Panamá y la IA",["Panamá está en etapas iniciales: el Canal conecta físicamente y ahora queremos hacerlo de manera digital.","Ventajas: punto estratégico y talento estudiantil."]]]},
{n:8,t:"Comunidad Dojo AI: democratizar el aprendizaje de la IA PARTE 2 (identidad digital)",s:"Apuntes sobre identidad digital y riesgos de la IA",k:"La identidad digital es tan importante como la física.",g:[
["Identidad y riesgos",["Identidad digital: todo lo que aparece en internet y puede identificarte (correo, fecha de nacimiento, seguridad social).","Riesgos de la IA: hacking, phishing y desinformación.","Phishing es la entrada de un ataque cibernético; vishing es un engaño por llamada."]],
["Seguridad y ley",["Tríada de la seguridad: confidencialidad, integridad y disponibilidad (CIA por sus siglas en inglés).","Ley 82 de 2019 sobre ciberdelincuencia: sanciona el uso no consentido de datos e imágenes íntimas."]]]},
{n:9,t:"Clase de Lenguaje 1: etapas del discurso",s:"Día 7, 12 de octubre. Maida Díaz (lenguaje) y Cibeles de Freitas (proyección)",k:"Atrévete a cometer errores.",g:[
["Tres etapas",["Contenido: definir el objetivo, investigar, organizar, estructurar párrafos (ilación de ideas), practicar (argumentación) y preparar visualmente.","Lenguaje: dicción, gramática y selección de palabras.","Proyección: naturalidad, control corporal y uso de la voz."]],
["Reglas de lenguaje",["Usar un lenguaje adecuado a la RAE y estar dispuesto a recibir correcciones. Así como hablas, escribe.","Evitar muletillas («bueno», «o sea»). No se dice «buen día», «ok» ni «como decía». Hay diferencia entre afónico y disfónico.","No somos rivales, solo una competencia. Si cultivas terror por dentro, no aprenderás. No usar tanto las manos.","Mejor vocabulario: «conjunto» → «acervo»; «la sorpresa me enmudeció»."]]]},
{n:10,t:"Clase de Contenido 1: soluciones innovadoras y liderazgo",s:"Investigación y enfoque, estructuración y argumentación. Karin Kempft",k:"El fracaso es parte de nuestro crecimiento, y admitir errores es crucial.",g:[
["Liderazgo e innovación",["Hay habilidades que permiten sobrevivir al auge tecnológico; un líder primero trabaja en sí mismo.","Marco Educativo 4.0: habilidades digitales, interpersonales, ciudadanía global y creatividad e innovación (la innovación es la creatividad en acción).","Sostenibilidad: ambiental, económica y social. Los ODS son 17."]],
["Aprendizaje y redes",["Aprendizaje personalizado: inclusivo, colaborativo y centrado en el estudiante.","Las redes solo quieren que veas lo que entiendas como verdad: hacer búsquedas diferentes. No queremos escuchar lo mismo."]],
["Mi palabra",["Altitud: subir a la cima sin temer a lo alto que estoy. Contexto: Cuarta Revolución Industrial."]],
["Improvisación y desempeño espontáneo",["No improvisar: el objetivo de improvisar es que el discurso tenga seguridad. En el desempeño espontáneo no hay que hacerse el gracioso para ocultar nervios; hay que cuidar el tiempo y el contenido.","Valores: be happy, be hungry, be humble (estar abierto a escuchar), high achieving (no conformarse, excelencia) y honest.","Palabras de los profesores: positividad (en lo negativo siempre hay cosas positivas), lealtad y confianza, «las palabras duelen más que los golpes» y «gracias a Dios»."]],
["Práctica de investigación",["Pregunta: ¿qué impide a Panamá convertirse en un país desarrollado? Tema: el desarrollo económico de Panamá.","Errores del desempeño espontáneo: no recordar bien lo que dijiste (lenguaje y estructura), mover demasiado las manos (proyección) y usar frases de adorno."]]]},
{n:11,t:"Clase de Proyección 1: el método CONVENZO",s:"Día 7. Cómo convencer, proyectar y estructurar un discurso",k:"Cuando crees lo que dices, los demás te creen.",g:[
["Ideas base",["Si ustedes no se venden, nadie los va a vender. Ser un orador inmersivo.","Mayor miedo: quedarme en blanco; hay que hacer lo posible para que no se note que lo olvidaste.","Todo lo que sale de tu boca es tu responsabilidad, salgas o no en televisión."]],
["Método CONVENZO",["Conectar con tu audiencia desde el primer momento.","Organizar tus ideas y estructurarlas con claridad.","Narrar historias que conecten emocionalmente.","Vibrar con energía positiva y apasionada.","Evidenciar tus puntos con hechos y datos.","Neutralizar objeciones con calma y respeto.","Zambullirte en ti para lograr una impresión y optimizar tus habilidades."]],
["Consejos de proyección",["No dar vueltas; antes de hablar, animarte con palabras bonitas o música. Hablar con entusiasmo y pasión.","Con cifras, decir «aproximadamente» o «más de…». Recordar que todo el tiempo estoy hablando en público y espantar los malos pensamientos.","Primera impresión: los dos primeros segundos. Todo vende. Breve = 2 × bueno.","Conocer tu muletilla para evitarla: si repites palabras, pierdes la atención. Pasión, naturalidad y humildad no se pueden cambiar.","Evitar frases como «la IA no es el futuro, es el presente»."]],
["Estructura y storytelling",["Una idea desordenada se pierde antes de ser comprendida: lluvia de ideas con propósito y estructura (problema, solución, acción).","Conexión emocional: ¿por qué esto te importa a ti? Storytelling con detalles sensoriales (vista, olfato, tacto).","No dejar que las manos distraigan ni hacer gestos literales. Hacer sentir especial al público (decir el nombre más común).","Estructura 2: inicio de impacto, mantener a la audiencia enganchada y llamado a la acción (PIDE)."]],
["Resumen de 10 puntos",["Conoce tu audiencia; 50 % palabras; pinta tus palabras; mejora tu voz; cambia en tus redes; usa la IA; aniquila el NO; pide sin pena; CONVENZO."]]]},
{n:12,t:"CENFOTEC: cómo responde la IA y dos enfoques",s:"Día 8, 13 de octubre. Tomás de Camino Beck, Universidad CENFOTEC",k:"El lenguaje no solo comunica, también manipula.",g:[
["Contexto",["En 2022, OpenAI colocó ChatGPT en el mercado.","El lenguaje es la herramienta que usamos los seres humanos para usar el conocimiento. Visión transhumanista: la tecnología amplifica nuestras capacidades.","Ser disciplinado es ser riguroso y constante; insolencia es cuestionar lo que te informan e impertinente es decir las cosas tal como son."]],
["Cómo da respuestas la IA",["Las computadoras usan compuertas lógicas (AND, OR, XOR).","La IA busca todas las respuestas posibles y evalúa los parámetros para hallar la «mejor respuesta». Se inspira en la neurona: el perceptrón.","GPT: Generative Pre-trained Transformer."]],
["Simbólica vs. conexionista",["Deep Blue (ajedrez): IA simbólica, conoce las reglas humanas y evalúa unos 200 millones de posiciones por segundo (memoria).","AlphaGo: IA conexionista, solo conoce las reglas, pero genera respuestas nunca vistas por autoaprendizaje; derrotó a Lee Sedol innovando con prueba y error.","Según la charla, ChatGPT es mejor para conversar y Claude para vibe coding. La educación se volvió una institución y los jóvenes perdieron el «porqué»."]]]},
{n:13,t:"UTP: carreras con IA y herramientas",s:"Día 8, 13 de octubre",k:"Lo que llamamos IA suele ser IA generativa.",g:[
["Mapa de la IA",["IA ⊃ machine learning ⊃ deep learning ⊃ IA generativa. Lo que normalmente llamamos IA es la generativa, pues reemplaza una habilidad humana sin determinismo."]],
["Observatorio y ética",["Observatorio de la UTP: página web con los proyectos de la UTP con IA (prótesis humanas, aplicación a gallineros y a tilapias).","Principios de Asilomar: 23 principios sobre cómo usar la IA (investigación, ética, visión). Isaac Asimov, Visiones de robot, 1990."]]]},
{n:14,t:"SENACYT: Estrategia de Inteligencia Artificial de Panamá",s:"Día 8, 13 de octubre",k:"Los datos tienen que ser confiables para que la IA los pueda manejar.",g:[
["La estrategia",["Proyecto del Estado sobre las acciones que se harán con la IA; todavía no cuenta con financiamiento propio.","La IA puede representar del 2 % al 4 % del PIB mundial. El BID estima que entre el 36 % y el 43 % de los empleos en América Latina están expuestos a automatización.","Panamá está perdiendo competitividad frente a la región."]],
["La paradoja de Panamá",["Somos un hub de conectividad con gran biodiversidad, y un Canal digital es una posibilidad.","Problemas: infraestructura, falta de personal y desconexión entre los datos de las instituciones (ej.: MINSA y CSS). Consumo eléctrico estimado entre 4 y 6 GW."]],
["Instituciones y seguridad",["SENACYT no puede entrometerse en las acciones del MEDUCA (50 000 docentes). Una institución pública debe seguir todas las reglas; una privada puede hacer lo que quiera salvo lo prohibido.","Seguridad de datos: no se pueden comprar GPU directamente a NVIDIA por ser tecnología de doble uso en EE. UU.","Pax Silica: programa de EE. UU. de comercio de semiconductores e IA, con control de aduanas."]]]},
{n:15,t:"Fundación Panamá Líder",s:"Capacitación de liderazgo",k:"Una fundación que ofrece capacitaciones de liderazgo.",g:[
["Apuntes",["Guillermo Ponce fue el encargado de comprar Claro para la unión con +Móvil; sigue como director de la Junta Directiva, pero ya no asumirá la presidencia.","Telenet será la nueva empresa de Rocío, una empresa de telecomunicaciones europea (lectura dudosa)."]]]},
{n:16,t:"Clase de Lenguaje 2: naturalidad y voz propia",s:"Día 10, 15 de octubre. Dr. Miguel Candanedo",k:"Ser dueños de nuestro relato personal y único (Michelle Obama).",g:[
["Dicción y naturalidad",["Naturalidad + lenguaje = dicción. Evitar extranjerismos inconvenientes y repasar las preposiciones.","El orador no debe improvisar; improvisar sirve para dar seguridad al discurso.","Es más importante ser natural que forzarse a hablar perfectamente."]],
["Originalidad",["No copiar frases; parafrasear también es plagio. Preguntarse «¿qué quieres decir?» y usar el nivel 3, crítico: sé tú.","No separar el lenguaje verbal del corporal. Cada pregunta tiene al menos 2 ejes, que no deben estar separados."]],
["Tarea 2",["Voz, relato, experiencia y palabras propias. Tema de improvisación con el discurso ideal: dicción y gramática."]]]},
{n:17,t:"Clase de Contenido 2: pensamiento crítico y el terremoto",s:"Ejercicio de la Tarea 1 de Contenido",k:"El adorno no puede verse más significativo que el tema principal.",g:[
["Pensamiento crítico",["Es la habilidad de filtrar la información. Las redes sociales lo afectan y la IA puede subirlo o bajarlo; además, es capaz de engañarnos."]],
["Ejercicio con noticias",["Noticia 1: el terremoto del 14 de octubre en Los Santos y la primera víctima, Elena Barría.","Noticia 2: llegan trabajadores sociales y psicólogos a las zonas afectadas: el pueblo sigue en pie.","Mi discurso: sismo de magnitud 7,7, más de mil viviendas destruidas y más de diez mil heridos o afectados (verificar cifras antes del concurso). Que sea la oportunidad de demostrar lo que el pueblo panameño puede superar."]],

function startQ(n){cur=+n||0;mode("q");qs=sh(Q.filter(q=>!cur||q[0]==cur).map(q=>({t:q[0],q:q[1],a:q[2],o:sh(q.slice(2,6)),e:q[6]})));qi=0;sc=0;sel=null;dq()}
function dq(){const f=`<p><label>Tema: <select onchange="startQ(this.value)"><option value="0">Todos (90 preguntas)</option>${T.filter(t=>Q.some(q=>q[0]==t.n)).map(t=>`<option value="${t.n}" ${t.n==cur?"selected":""}>${t.n}. ${t.t}</option>`).join("")}</select></label></p>`;
if(qi>=qs.length){const p=Math.round(100*sc/qs.length);$("#quiz").innerHTML=f+`<h2>${sc} de ${qs.length} (${p} %)</h2><p>${p>=80?"Excelente dominio del tema. Estás listo para el concurso.":"Repasa los temas y vuelve a intentarlo. Concéntrate en los que fallaste."}</p><button class="btn p" onclick="startQ(${cur})">Repetir</button> <button class="btn" onclick="go(1)">Volver a los temas</button>`;return}
const q=qs[qi];$("#quiz").innerHTML=f+`<p class="sub">Tema ${q.t}. Pregunta ${qi+1} de ${qs.length}</p><p class="qtext">${q.q}</p>`+q.o.map((o,k)=>`<button class="o ${sel===null?"":o==q.a?"g":k==sel?"b":""}" onclick="pk(${k})">${o}</button>`).join("")+(sel===null?"":`<p class="ex"><b>${q.o[sel]==q.a?"Correcto.":"Respuesta: "+q.a}</b> ${q.e}</p><button class="btn p" onclick="qi++;sel=null;dq()">Siguiente</button>`)}
function pk(k){if(sel!==null)return;sel=k;if(qs[qi].o[k]==qs[qi].a)sc++;dq()}
document.addEventListener("keydown",e=>{if($("#P").hidden)return;if(e.key=="ArrowRight")go(i+1);if(e.key=="ArrowLeft")go(i-1)});
go(0);
</script></body></html>
